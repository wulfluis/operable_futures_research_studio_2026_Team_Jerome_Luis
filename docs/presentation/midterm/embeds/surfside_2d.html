<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#0b0b0b;overflow:hidden;font-family:Consolas,"Courier New",monospace;color:#f2f2f2}
svg{position:absolute;inset:0;width:100%;height:100%}
.l{fill:none;stroke:#f2f2f2;stroke-width:2}
.g{fill:none;stroke:#6f6f6f;stroke-width:1}
.r{fill:none;stroke:#d62728;stroke-width:3;stroke-linejoin:miter}
.f{transition:opacity .8s,transform 1.6s cubic-bezier(.55,0,.9,.4)}
#water,#cracks,#boxes,#debris{opacity:0}
[data-s="1"] #water,[data-s="2"] #water,[data-s="3"] #water{opacity:1}
[data-s="2"] #cracks,[data-s="3"] #cracks,[data-s="4"] #cracks{opacity:1}
[data-s="2"] #boxes,[data-s="3"] #boxes{opacity:1}
[data-s="4"] #deck{transform:translateY(118px) rotate(3deg);opacity:.25}
[data-s="4"] #east{transform:translate(30px,150px) rotate(8deg);opacity:.15}
[data-s="4"] #debris,[data-s="5"] #debris{opacity:1}
[data-s="5"] #deck,[data-s="5"] #east{opacity:0}
[data-s="5"] #draw{opacity:.25}
#draw{transition:opacity 1s}
.drop{animation:drip 1.4s linear infinite}
@keyframes drip{0%{transform:translateY(-30px);opacity:0}30%{opacity:1}100%{transform:translateY(40px);opacity:0}}
.seep{stroke:#8c8c8c;stroke-width:1.5;stroke-dasharray:4 6;animation:seep 1.2s linear infinite;fill:none}
@keyframes seep{to{stroke-dashoffset:-20}}
#cap{position:absolute;left:28px;right:28px;bottom:22px}
#t{font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
#u{font-size:20px;color:#bfbfbf;margin-top:6px;min-height:24px}
#step{position:absolute;left:28px;top:22px;font-size:20px;color:#a6a6a6}
#rec{position:absolute;right:28px;top:22px;font-size:20px;color:#d62728}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#d62728;width:0}
#end{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:44px;font-weight:700;text-transform:uppercase;opacity:0;transition:opacity 1s}
[data-s="5"] #end{opacity:1}
